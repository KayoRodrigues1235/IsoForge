plugins {
    id 'java'
    id 'application'
}

group = 'isoforge'
version = '0.1.0'

repositories {
    mavenCentral()
}

ext {
    gdxVersion = '1.13.1'
    junitVersion = '5.11.4'
}

dependencies {
    // Núcleo do libGDX: matemática, coleções, ciclo de vida da aplicação.
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"

    // Backend desktop (LWJGL3): janela, contexto OpenGL, teclado/mouse.
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"

    // Bibliotecas nativas (.so/.dll/.dylib) que o backend carrega em runtime.
    // É runtimeOnly porque nada no código-fonte importa essas classes.
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"

    // Os testes não precisam de backend nem de natives: `entity` e `world` não
    // conhecem OpenGL, então a simulação inteira roda sem abrir janela. É essa
    // separação que torna o jogo testável, e o teste é que a mantém honesta.
    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'isoforge.DesktopLauncher'
}
