plugins {
    id 'java'
    id 'application'
}

group = 'isoforge'
version = '0.1.0'

repositories {
    mavenCentral()
}

ext {
    gdxVersion = '1.13.1'
    junitVersion = '5.11.4'
}

dependencies {
    // Núcleo do libGDX: matemática, coleções, ciclo de vida da aplicação.
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"

    // Backend desktop (LWJGL3): janela, contexto OpenGL, teclado/mouse.
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"

    // Bibliotecas nativas (.so/.dll/.dylib) que o backend carrega em runtime.
    // É runtimeOnly porque nada no código-fonte importa essas classes.
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"

    // FreeType: gera bitmaps de fonte em tempo de execução a partir de um .ttf.
    // É o que permite um arquivo só atender título, corpo e legenda em tamanhos
    // diferentes, sem nenhum ser uma versão escalada (e macia) do outro.
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"

    // Os testes não precisam de backend nem de natives: `entity` e `world` não
    // conhecem OpenGL, então a simulação inteira roda sem abrir janela. É essa
    // separação que torna o jogo testável, e o teste é que a mantém honesta.
    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// A pasta assets/ entra como recurso, e não como diretório de trabalho da task
// `run`. A diferença importa: assim `Gdx.files.internal` acha os arquivos tanto
// no `gradlew run` quanto num jar empacotado, sem o jogo precisar saber de qual
// dos dois foi iniciado.
sourceSets {
    main {
        resources {
            srcDirs += ['assets']
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'isoforge.DesktopLauncher'
}

// Jar único, com dependências e bibliotecas nativas dentro. O `natives-desktop`
// do libGDX já traz .so, .dll e os dois .dylib (Intel e Apple Silicon), então o
// mesmo arquivo roda nas três plataformas — o que importa aqui, já que a build
// para Mac sai de uma máquina Linux.
tasks.register('fatJar', Jar) {
    group = 'distribution'
    description = 'Empacota o jogo e todas as dependências num jar executável.'

    archiveClassifier = 'all'
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }

    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    // Assinaturas das dependências não valem para o jar remontado, e cada
    // dependência traz o seu module-info — que só atrapalha num classpath comum.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// O pacote que vai para quem testa no Mac: o jar, um lançador de duplo clique
// e as instruções. Não é um .app nem um .dmg — ambos exigiriam empacotar numa
// máquina macOS. O preço disso é o testador precisar do Java 21 instalado.
tasks.register('pacoteMac', Zip) {
    group = 'distribution'
    description = 'Monta o zip de teste para macOS (jar + lançador + instruções).'

    dependsOn tasks.named('fatJar')
    archiveFileName = "IsoForge-${project.version}-mac.zip"
    destinationDirectory = layout.buildDirectory.dir('dist')

    // Uma pasta dentro do zip, para o zip não explodir arquivos soltos na
    // pasta de Downloads de quem abrir.
    into("IsoForge-${project.version}") {
        from(tasks.named('fatJar')) {
            rename '.*', 'IsoForge.jar'
        }
        from('packaging/mac/LEIA-ME.txt')
        from('packaging/mac/IsoForge.command') {
            // Sem o bit de execução o Finder abre o script num editor de texto
            // em vez de rodá-lo.
            filePermissions { unix(0755) }
        }
    }
}
