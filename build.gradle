plugins {
    id 'java'
    id 'application'
}

group = 'isoforge'
version = '0.1.0'

repositories {
    mavenCentral()
}

ext {
    gdxVersion = '1.13.1'
    junitVersion = '5.11.4'
}

dependencies {
    // Núcleo do libGDX: matemática, coleções, ciclo de vida da aplicação.
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"

    // Backend desktop (LWJGL3): janela, contexto OpenGL, teclado/mouse.
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"

    // Bibliotecas nativas (.so/.dll/.dylib) que o backend carrega em runtime.
    // É runtimeOnly porque nada no código-fonte importa essas classes.
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"

    // FreeType: gera bitmaps de fonte em tempo de execução a partir de um .ttf.
    // É o que permite um arquivo só atender título, corpo e legenda em tamanhos
    // diferentes, sem nenhum ser uma versão escalada (e macia) do outro.
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"

    // Os testes não precisam de backend nem de natives: `entity` e `world` não
    // conhecem OpenGL, então a simulação inteira roda sem abrir janela. É essa
    // separação que torna o jogo testável, e o teste é que a mantém honesta.
    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// A pasta assets/ entra como recurso, e não como diretório de trabalho da task
// `run`. A diferença importa: assim `Gdx.files.internal` acha os arquivos tanto
// no `gradlew run` quanto num jar empacotado, sem o jogo precisar saber de qual
// dos dois foi iniciado.
sourceSets {
    main {
        resources {
            srcDirs += ['assets']
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'isoforge.DesktopLauncher'
}
